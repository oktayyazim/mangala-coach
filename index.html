<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mangala Coach</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
    }

    #board {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-top: 50px;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    .pit {
        width: 60px;
        height: 60px;
        border: 2px solid black;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        user-select: none;
    }
</style>

</head>

<body>

<h1>Mangala Coach</h1>

<div id="board">
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
</div>

<script>
    const row1 = document.getElementById("row1");
    const row2 = document.getElementById("row2");

    let pits = [];

    function moveStones(index) {
        let stones = pits[index].count;

        if (stones === 0) return;

        pits[index].count = 0;

        while (stones > 0) {
            index = (index + 1) % pits.length;
            pits[index].count++;
            render();
            stones--;
        }
    }

    function render() {
        row1.innerHTML = "";
        row2.innerHTML = "";

        pits.forEach((pit, i) => {
            const div = document.createElement("div");
            div.className = "pit";
            div.innerText = pit.count;

            div.onclick = () => moveStones(i);

            if (i < 6) row1.appendChild(div);
            else row2.appendChild(div);
        });
    }

    function init() {
        pits = [];

        for (let i = 0; i < 12; i++) {
            pits.push({ count: 4 });
        }

        render();
    }

    init();
</script>

</body>
</html>
