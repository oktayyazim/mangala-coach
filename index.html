<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangala Coach</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(12, 60px);
            gap: 10px;
            justify-content: center;
            margin-top: 50px;
        }

        .pit {
            width: 60px;
            height: 60px;
            border: 2px solid black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Mangala Coach</h1>

    <div id="board"></div>

    <script>
        const board = document.getElementById("board");

        // Tahtayı oluştur
        for (let i = 0; i < 12; i++) {
            const pit = document.createElement("div");
            pit.className = "pit";
            pit.innerText = "4";

            pit.onclick = () => moveStones(pit);

            board.appendChild(pit);
        }

        // Taş dağıtma sistemi
        function moveStones(pit) {
            let stones = Number(pit.innerText);
            if (stones === 0) return;

            pit.innerText = "0";

            let index = Array.from(board.children).indexOf(pit);

            while (stones > 0) {
                index = (index + 1) % 12;
                board.children[index].innerText =
                    Number(board.children[index].innerText) + 1;
                stones--;
            }
        }
    </script>

</body>
</html>
